name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # same as the weekly run

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests (offline -- no secrets, network, or email)
        run: python -m pytest -q -rs
