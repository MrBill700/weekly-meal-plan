name: Weekly Meal Plan Email

on:
  schedule:
    # 14:00 UTC every Saturday = 7am Pacific (PDT). Adjust to your timezone.
    # https://crontab.guru helps you build the expression.
    - cron: '0 14 * * 6'
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write           # so the run can commit updated history back

jobs:
  send-meal-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run meal planner
        env:
          # Required
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASS:     ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: secondary provider used only if the primary model errors
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional overrides (otherwise taken from config.json)
          OPENROUTER_MODELS:  ${{ secrets.OPENROUTER_MODELS }}
          ALERT_RECIPIENT:    ${{ secrets.ALERT_RECIPIENT }}
          PRIMARY_MODEL:      ${{ secrets.PRIMARY_MODEL }}
        run: python meal_planner.py

      # Recording the week's meals keeps dinners from repeating, and the commit
      # also counts as repo activity so GitHub never pauses the schedule.
      - name: Commit meal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meal_history.json recipe_catalog.json
          git diff --staged --quiet || (git commit -m "Record meal history for week of $(date -u +%Y-%m-%d)" && git push)
